name: Build slim libmame (macOS arm64)

# Builds MAME with ONLY the drivers listed in keep-drivers.flt
# (paths relative to src/mame). Edit that file to add or drop games.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use keep-drivers.flt as the driver filter
        run: |
          cp keep-drivers.flt slim.flt
          wc -l slim.flt
          for f in $(cat slim.flt); do test -f src/mame/$f || { echo "missing $f"; exit 1; }; done

      - name: Build libmame (Mac Catalyst, arm64 only)
        run: ./make-ios.sh mac-catalyst-arm64 SOURCEFILTER=slim.flt

      - name: Package
        run: |
          ls -lh libmame-mac-arm64.a
          gzip --keep --force libmame-mac-arm64.a

      - uses: actions/upload-artifact@v4
        with:
          name: libmame-mac-arm64-slim
          path: libmame-mac-arm64.a.gz
          if-no-files-found: error
